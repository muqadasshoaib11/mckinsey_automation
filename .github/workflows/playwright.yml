name: Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  suites:
    name: Run suite scripts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium chromium-headless-shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright

      - name: Run suites
        run: |
          missing=0
          for name in ADMIN_EMAIL ADMIN_PASSWORD USER_EMAIL USER_PASSWORD REVIEWER_EMAIL REVIEWER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::${name} is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          set +e
          npx playwright test --reporter=list,github,html
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          function walk(dir, files = []) {
            if (!fs.existsSync(dir)) return files;
            for (const name of fs.readdirSync(dir)) {
              const full = path.join(dir, name);
              if (fs.statSync(full).isDirectory()) walk(full, files);
              else if (name.endsWith(".md")) files.push(full);
            }
            return files;
          }
          for (const file of walk("test-results")) {
            const text = fs.readFileSync(file, "utf8");
            const error = text.match(/Error:[\s\S]{0,900}/);
            if (!error) continue;
            const line = error[0].replace(/\s+/g, " ").slice(0, 700);
            console.log(`::error title=${path.basename(path.dirname(file))}::${line}`);
          }
          NODE
            exit "$code"
          fi
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          REVIEWER_PASSWORD: ${{ secrets.REVIEWER_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
